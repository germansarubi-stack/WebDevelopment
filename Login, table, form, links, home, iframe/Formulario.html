<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" 
    rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" 
    crossorigin="anonymous">
</head>
<body class="bg-danger d-flex justify-content-center ligna-items-center" style="--bs-bg-opacity: 0.2">

    <!--Titulo y recuadro-->
    <div class="bg-white p-4  mt-1 border rounded-3" style="width: 50rem;">
        <p class="text-center fst-italic fs-1">
            Admision de proceso de Psicoterapia
        </p>

        <!--todos los input label-->
        <div class="container">
            <form class="row g-3 ">
                <div class="col-6">
                  <label for="nombreinput" class="fw-semibold">
                    Nombre/s :
                  </label>  
                  <input type="nombre" class="form-control" id="nombreinput" placeholder="Escribe tu nombre" aria-describedby="ejemnombre">
                  <div id="ejemnombre" class="form-text">
                    Ej: Pablo Martin
                  </div>
                </div>

                <div class="col-6">
                    <label for="apellidoinput" class="fw-semibold">
                      Apellido/s:
                    </label>  
                    <input type="apellido" class="form-control" id="apellidoinput" placeholder="Escribe tu apellido" aria-describedby="ejemapellido">
                    <div id="ejemapellido" class="form-text">
                        Ej: Pezer Garcia
                      </div>
                  </div>

                  <div class="col-6">
                    <label for="edadinput" class="fw-semibold">
                      Edad:
                    </label>  
                    <input type="edad" class="form-control" id="edadinput" placeholder="Escribe tu edad" aria-describedby="ejemedad">
                    <div id="ejemedad" class="form-text">
                        Ej: 32
                      </div>
                  </div>

                  <div class="col-6">
                    <label for="telefonoinput" class="fw-semibold">
                      Tel :
                    </label>  
                    <input type="telefono" class="form-control" id="telefonoinput" placeholder="Escribe tu numero de telefono" aria-describedby="ejemtel">
                    <div id="ejemtel" class="form-text">
                        Ej: 11-6548526, con caracteristica y sin separaciones
                      </div>
                  </div>
                
                  <div class="col-12">
                    <label for="emailinput" class="fw-semibold">
                      Email:
                    </label>  
                    <input type="email" class="form-control" id="emailinput" placeholder="Escribe tu Email" aria-describedby="ejememail">
                    <div id="ejememail" class="form-text">
                        Ej: email@ejemplo.com
                      </div>
                  </div>  

                

                <div class="col-12">
                <p>Disponibilidad horaria:</p>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" id="inlineCheckbox1" value="option1">
                    <label class="form-check-label" for="inlineCheckbox1">Mañana</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" id="inlineCheckbox2" value="option2">
                    <label class="form-check-label" for="inlineCheckbox2">Tarde</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" id="inlineCheckbox3" value="option3">
                    <label class="form-check-label" for="inlineCheckbox3">Noche</label>
                  </div>
                </div>

                <div class="mb-3">
                    <label for="exampleFormControlTextarea1" class="form-label">Tematicas o problematicas que te gustarian trabajar
                    (Importante para elegir el perfil profesional que mejor se ajuste a tus necesidades):    
                    </label>
                    <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
                </div>

                <div class="col-12">
                    <button type="submit" class="btn btn-primary">
                        Enviar 
                    </button>
                </div>



            </form>

        </div>


    </div>







    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" 
    crossorigin="anonymous"></script>
    
</body>
</html>
