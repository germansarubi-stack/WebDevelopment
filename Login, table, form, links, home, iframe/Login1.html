<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" 
    rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" 
    crossorigin="anonymous">
    <link rel="stylesheet" 
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<!--Fondo-->
<body class="bg-danger d-flex  justify-content-center ligna-items-center vh-100" style="--bs-bg-opacity: 0.4">

    <!--div donde contendremos todo el formato login-->
    <div
      class="bg-white p-4  mt-1 border rounded-3 text-secondary shadow"
      style="width: 25rem">
    
        <!--logo del login-->
        <div class="d-flex justify-content-center">
            <i class="bi bi-person-circle"
            alt="Login-Icon"
            style="font-size: 100px;">
            </i>
        </div>

        
        <!--paquete de caracterisiticas del usuario-->
        <div class="input-group mt-2">
        <div class="input-group-text bg-danger" style="--bs-bg-opacity: 0.7">
            <i class="bi bi-person"
            alt="Username-Icon"
            style="font-size: 25px;">
            </i>
        </div>
        <input
          class="form-control bg-light"
          type="text"
          placeholder="Usuario"
        />
        </div>

        <!--paquete de caracterisiticas de la contraseña-->
        <div class="input-group mt-1">
        <div class="input-group-text bg-danger" style="--bs-bg-opacity: 0.7">
            <i class="bi bi-lock"
            alt="Password-Icon"
            style="font-size: 25px;">
            </i>
        </div>
        <input
          class="form-control bg-light"
          type="password"
          placeholder="Contraseña"
        />
      </div>

      <!--configuracion del boton recuerdame e hipervinculo de contraseña olvidada-->
      <div class="d-flex justify-content-around mt-1">
        <div class="d-flex align-items-center gap-1">
          <input class="form-check-input" type="checkbox" />
          <div class="pt-1" style="font-size: 0.9rem">Recuerdame</div>
        </div>
        <div class="pt-1">
          <a
            href="#"
            class="text-decoration-none text-info fw-semibold fst-italic"
            style="font-size: 0.9rem"
            >Olvidaste tu contraseña?</a
            >
        </div>
      </div>

      <!--config boton de acceso-->
      <div class="btn btn-danger text-white w-100 mt-4 fw-semibold shadow-sm" style="--bs-bg-opacity: 0.7">
        Acceso
      </div>

      <!--config boton hipervinculo de registrar-->
      <div class="d-flex gap-1 justify-content-center mt-1">
        <div>No tienes cuenta?</div>
        <a href="#" class="text-decoration-none text-info fw-semibold"
          >Registrar</a
        >
      </div>

      <!--config de separacion de opciones-->
      <div class="p-3">
        <div class="border-bottom text-center" style="height: 0.9rem">
          <span class="bg-white px-3">o</span>
        </div>
      </div>

      <!--config boton e imagen de google-->
      <div
        class="bg-success btn d-flex gap-2 justify-content-center border mt-3 shadow-sm" style="--bs-bg-opacity: 0.7"
      >
        <i class="bi bi-google"
        alt="Google-Icon"
        style="font-size: 15px;"
        >
        </i>

        <div class="fw-semibold text-white">Continuar con Google</div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" 
    crossorigin="anonymous"></script>
</body>
</html>
